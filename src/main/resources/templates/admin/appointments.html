<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Appointments - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a th:href="@{/admin/dashboard}" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-green-500 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">HMS</span>
                    </a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-600">Appointments</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/admin/dashboard}" class="text-sm text-gray-600 hover:text-gray-900 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">All Appointments</h1>

        <div th:if="${#lists.isEmpty(appointments)}" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-12 text-center text-gray-500">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>
            No appointments yet.
        </div>
        
        <div th:if="${!#lists.isEmpty(appointments)}" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Patient</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Doctor</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Time</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Reason</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:each="appt : ${appointments}" class="hover:bg-gray-50 transition">
                            <td class="px-4 py-4 font-medium text-gray-800" th:text="${appt.patient.name}">Patient</td>
                            <td class="px-4 py-4 text-gray-600">Dr. <span th:text="${appt.doctor.name}">Doctor</span></td>
                            <td class="px-4 py-4 text-gray-600" th:text="${appt.date}">Date</td>
                            <td class="px-4 py-4 text-gray-600" th:text="${appt.time}">Time</td>
                            <td class="px-4 py-4 text-gray-600" th:text="${appt.reason}">Reason</td>
                            <td class="px-4 py-4">
                                <span th:class="${appt.status == 'CONFIRMED' ? 'px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium' : 
                                    (appt.status == 'PENDING' ? 'px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium' :
                                    (appt.status == 'COMPLETED' ? 'px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium' : 'px-3 py-1 bg-red-100 text-red-700 rounded-full text-xs font-medium'))}"
                                    th:text="${appt.status}">Status</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
