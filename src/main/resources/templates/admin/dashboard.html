<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-slate-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <span class="text-xl font-bold font-mono">HMS</span>
                    <span class="text-slate-400">|</span>
                    <span class="text-sm">Admin Dashboard</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-400">Admin</span>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard</h1>
            <p class="text-gray-600">Manage doctors, patients, and appointments.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="p-6 bg-white rounded-xl shadow-md border-l-4 border-cyan-500">
                <h3 class="text-3xl font-bold text-gray-800" th:text="${doctorCount}">0</h3>
                <p class="text-gray-500">Total Doctors</p>
            </div>
            <div class="p-6 bg-white rounded-xl shadow-md border-l-4 border-green-500">
                <h3 class="text-3xl font-bold text-gray-800" th:text="${patientCount}">0</h3>
                <p class="text-gray-500">Total Patients</p>
            </div>
            <div class="p-6 bg-white rounded-xl shadow-md border-l-4 border-purple-500">
                <h3 class="text-3xl font-bold text-gray-800" th:text="${appointmentCount}">0</h3>
                <p class="text-gray-500">Total Appointments</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <a th:href="@{/admin/doctors}" class="p-6 bg-white rounded-xl shadow-md hover:shadow-lg transition cursor-pointer border-l-4 border-blue-500">
                <h3 class="text-lg font-semibold text-gray-800">Manage Doctors</h3>
                <p class="text-sm text-gray-500 mt-1">Add, edit, delete doctors</p>
            </a>
            <a th:href="@{/admin/patients}" class="p-6 bg-white rounded-xl shadow-md hover:shadow-lg transition cursor-pointer border-l-4 border-green-500">
                <h3 class="text-lg font-semibold text-gray-800">Manage Patients</h3>
                <p class="text-sm text-gray-500 mt-1">Add, edit, delete patients</p>
            </a>
            <a th:href="@{/admin/appointments}" class="p-6 bg-white rounded-xl shadow-md hover:shadow-lg transition cursor-pointer border-l-4 border-purple-500">
                <h3 class="text-lg font-semibold text-gray-800">View Appointments</h3>
                <p class="text-sm text-gray-500 mt-1">View all appointments</p>
            </a>
        </div>
    </div>
</body>
</html>
