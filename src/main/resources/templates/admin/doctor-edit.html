<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Doctor - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a th:href="@{/admin/dashboard}" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-green-500 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">HMS</span>
                    </a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-600">Edit Doctor</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/admin/dashboard}" class="text-sm text-gray-600 hover:text-gray-900 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Edit Doctor</h2>
            
            <form th:action="@{'/admin/doctors/edit/' + ${doctor.id}}" method="post" class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" th:value="${doctor.name}" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                </div>
                
                <div>
                    <label for="specialty" class="block text-sm font-medium text-gray-700 mb-2">Specialty</label>
                    <select id="specialty" name="specialty" th:value="${doctor.specialty}" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                        <option value="General" th:selected="${doctor.specialty == 'General'}">General Medicine</option>
                        <option value="Cardiology" th:selected="${doctor.specialty == 'Cardiology'}">Cardiology</option>
                        <option value="Neurology" th:selected="${doctor.specialty == 'Neurology'}">Neurology</option>
                        <option value="Orthopedics" th:selected="${doctor.specialty == 'Orthopedics'}">Orthopedics</option>
                        <option value="Pediatrics" th:selected="${doctor.specialty == 'Pediatrics'}">Pediatrics</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                        <input type="text" id="phone" name="phone" th:value="${doctor.phone}" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" th:value="${doctor.email}" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                    </div>
                </div>
                
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-xl transition cursor-pointer shadow-md hover:shadow-lg">
                    Update Doctor
                </button>
            </form>
        </div>
    </div>
</body>
</html>
