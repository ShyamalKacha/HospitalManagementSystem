<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Doctors - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-slate-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/admin/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-slate-400">|</span>
                    <span class="text-sm">Manage Doctors</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/admin/dashboard}" class="text-sm hover:text-slate-300 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Manage Doctors</h1>
            <a th:href="@{/admin/doctors/add}" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition cursor-pointer">Add Doctor</a>
        </div>
        
        <div th:if="${param.added}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">Doctor added!</div>
        <div th:if="${param.updated}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">Doctor updated!</div>
        <div th:if="${param.deleted}" class="mb-4 p-3 bg-yellow-100 border border-yellow-400 text-yellow-700 rounded-lg">Doctor deleted!</div>
        <div th:if="${param.error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg">Username already exists!</div>

        <div th:if="${#lists.isEmpty(doctors)}" class="bg-white rounded-xl shadow-md p-12 text-center text-gray-500">No doctors yet.</div>
        
        <table th:if="${!#lists.isEmpty(doctors)}" class="w-full bg-white rounded-xl shadow-md overflow-hidden">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Name</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Specialty</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Phone</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Email</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="doc : ${doctors}" class="border-t">
                    <td class="px-4 py-3 font-medium" th:text="${doc.name}">Name</td>
                    <td class="px-4 py-3 text-gray-600" th:text="${doc.specialty}">Specialty</td>
                    <td class="px-4 py-3 text-gray-600" th:text="${doc.phone}">Phone</td>
                    <td class="px-4 py-3 text-gray-600" th:text="${doc.email}">Email</td>
                    <td class="px-4 py-3">
                        <a th:href="@{/admin/doctors/edit/{id}(id=${doc.id})}" class="text-blue-600 hover:text-blue-800 text-sm mr-3 cursor-pointer">Edit</a>
                        <form th:action="@{/admin/doctors/delete/{id}(id=${doc.id})}" method="post" class="inline">
                            <button type="submit" class="text-red-600 hover:text-red-800 text-sm cursor-pointer">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
