<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Doctors - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a th:href="@{/admin/dashboard}" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-green-500 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">HMS</span>
                    </a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-600">Manage Doctors</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/admin/dashboard}" class="text-sm text-gray-600 hover:text-gray-900 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Manage Doctors</h1>
            <a th:href="@{/admin/doctors/add}" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition cursor-pointer">+ Add Doctor</a>
        </div>
        
        <div th:if="${param.added}" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-xl">Doctor added!</div>
        <div th:if="${param.updated}" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-xl">Doctor updated!</div>
        <div th:if="${param.deleted}" class="mb-4 p-3 bg-yellow-50 border border-yellow-200 text-yellow-600 rounded-xl">Doctor deleted!</div>
        <div th:if="${param.error}" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl">Username already exists!</div>

        <div th:if="${#lists.isEmpty(doctors)}" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-12 text-center text-gray-500">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            No doctors yet.
        </div>
        
        <div th:if="${!#lists.isEmpty(doctors)}" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Name</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Specialty</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Phone</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Email</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:each="doc : ${doctors}" class="hover:bg-gray-50 transition">
                            <td class="px-4 py-4 font-medium text-gray-800" th:text="${doc.name}">Name</td>
                            <td class="px-4 py-4 text-gray-600" th:text="${doc.specialty}">Specialty</td>
                            <td class="px-4 py-4 text-gray-600" th:text="${doc.phone}">Phone</td>
                            <td class="px-4 py-4 text-gray-600" th:text="${doc.email}">Email</td>
                            <td class="px-4 py-4">
                                <a th:href="@{'/admin/doctors/edit/' + ${doc.id}}" class="text-blue-600 hover:text-blue-800 text-sm font-medium mr-4 cursor-pointer">Edit</a>
                                <form th:action="@{'/admin/doctors/delete/' + ${doc.id}}" method="post" class="inline">
                                    <button type="submit" class="text-red-600 hover:text-red-800 text-sm font-medium cursor-pointer">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
