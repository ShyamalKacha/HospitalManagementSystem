<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Appointments - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-emerald-200">|</span>
                    <span class="text-sm">Appointments</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-sm hover:text-emerald-200 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-emerald-800 hover:bg-emerald-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">My Appointments</h1>
        
        <div th:if="${param.confirmed}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">Appointment confirmed!</div>
        <div th:if="${param.completed}" class="mb-4 p-3 bg-blue-100 border border-blue-400 text-blue-700 rounded-lg">Appointment completed!</div>

        <div th:if="${#lists.isEmpty(appointments)}" class="bg-white rounded-xl shadow-md p-12 text-center text-gray-500">No appointments yet.</div>
        
        <table th:if="${!#lists.isEmpty(appointments)}" class="w-full bg-white rounded-xl shadow-md overflow-hidden">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Patient</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Date</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Time</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Reason</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Status</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appt : ${appointments}" class="border-t">
                    <td class="px-4 py-3" th:text="${appt.patient.name}">Patient</td>
                    <td class="px-4 py-3" th:text="${appt.date}">Date</td>
                    <td class="px-4 py-3" th:text="${appt.time}">Time</td>
                    <td class="px-4 py-3 text-gray-600" th:text="${appt.reason}">Reason</td>
                    <td class="px-4 py-3">
                        <span th:class="${appt.status == 'CONFIRMED' ? 'px-2 py-1 bg-green-100 text-green-700 rounded text-xs' : 
                            (appt.status == 'PENDING' ? 'px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs' :
                            (appt.status == 'COMPLETED' ? 'px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs' : 'px-2 py-1 bg-red-100 text-red-700 rounded text-xs'))}"
                            th:text="${appt.status}">Status</span>
                    </td>
                    <td class="px-4 py-3">
                        <form th:if="${appt.status == 'PENDING'}" th:action="@{/doctor/appointments/confirm/{id}(id=${appt.id})}" method="post" class="inline">
                            <button type="submit" class="text-green-600 hover:text-green-800 text-sm cursor-pointer mr-2">Confirm</button>
                        </form>
                        <form th:if="${appt.status == 'CONFIRMED'}" th:action="@{/doctor/appointments/complete/{id}(id=${appt.id})}" method="post" class="inline">
                            <button type="submit" class="text-blue-600 hover:text-blue-800 text-sm cursor-pointer">Complete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
