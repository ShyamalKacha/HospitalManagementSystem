<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Dashboard - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <span class="text-xl font-bold font-mono">HMS</span>
                    <span class="text-emerald-200">|</span>
                    <span class="text-sm">Doctor Dashboard</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-emerald-200" th:text="${doctor?.name}">Dr. Name</span>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-emerald-800 hover:bg-emerald-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Welcome, Dr. <span th:text="${doctor?.name}">Doctor</span>!</h1>
            <p class="text-gray-600">Manage your patients and appointments.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <a th:href="@{/doctor/appointments}" class="p-6 bg-white rounded-xl shadow-md hover:shadow-lg transition cursor-pointer border-l-4 border-emerald-500">
                <h3 class="text-lg font-semibold text-gray-800">Appointments</h3>
                <p class="text-sm text-gray-500 mt-1">View schedule</p>
            </a>
            <a th:href="@{/doctor/patients}" class="p-6 bg-white rounded-xl shadow-md hover:shadow-lg transition cursor-pointer border-l-4 border-blue-500">
                <h3 class="text-lg font-semibold text-gray-800">Patients</h3>
                <p class="text-sm text-gray-500 mt-1">Your patient list</p>
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Recent Appointments</h2>
            <div th:if="${#lists.isEmpty(appointments)}" class="text-gray-500 text-center py-8">
                No appointments yet.
            </div>
            <table th:if="${!#lists.isEmpty(appointments)}" class="w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Patient</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Date</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Time</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Reason</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Status</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appt : ${appointments}" class="border-t">
                        <td class="px-4 py-3" th:text="${appt.patient.name}">Patient</td>
                        <td class="px-4 py-3" th:text="${appt.date}">Date</td>
                        <td class="px-4 py-3" th:text="${appt.time}">Time</td>
                        <td class="px-4 py-3 text-gray-600" th:text="${appt.reason}">Reason</td>
                        <td class="px-4 py-3">
                            <span th:class="${appt.status == 'CONFIRMED' ? 'px-2 py-1 bg-green-100 text-green-700 rounded text-xs' : 
                                (appt.status == 'PENDING' ? 'px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs' :
                                (appt.status == 'COMPLETED' ? 'px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs' : 'px-2 py-1 bg-red-100 text-red-700 rounded text-xs'))}"
                                th:text="${appt.status}">Status</span>
                        </td>
                        <td class="px-4 py-3">
                            <form th:if="${appt.status == 'PENDING'}" th:action="@{/doctor/appointments/confirm/{id}(id=${appt.id})}" method="post" class="inline">
                                <button type="submit" class="text-green-600 hover:text-green-800 text-sm cursor-pointer mr-2">Confirm</button>
                            </form>
                            <form th:if="${appt.status == 'CONFIRMED'}" th:action="@{/doctor/appointments/complete/{id}(id=${appt.id})}" method="post" class="inline">
                                <button type="submit" class="text-blue-600 hover:text-blue-800 text-sm cursor-pointer">Complete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
