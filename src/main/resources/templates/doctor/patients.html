<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Patients - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a th:href="@{/doctor/dashboard}" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-green-500 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">HMS</span>
                    </a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-600">Patients</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-sm text-gray-600 hover:text-gray-900 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">My Patients</h1>
        
        <div th:if="${param.recordAdded}" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-xl">
            Medical record added successfully!
        </div>
        <div th:if="${param.prescriptionAdded}" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-xl">
            Prescription added successfully!
        </div>

        <div th:if="${#lists.isEmpty(appointments)}" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-12 text-center text-gray-500">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </div>
            No patients yet.
        </div>
        
        <div th:each="appt : ${appointments}" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-4 hover:shadow-md transition">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-semibold text-gray-800" th:text="${appt.patient.name}">Patient Name</h3>
                    <p class="text-sm text-gray-500">Age: <span th:text="${appt.patient.age}">0</span> | Gender: <span th:text="${appt.patient.gender}">-</span></p>
                    <p class="text-sm text-gray-500" th:text="'Phone: ' + ${appt.patient.phone}">Phone</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500" th:text="${appt.date} + ' at ' + ${appt.time}">DateTime</p>
                </div>
            </div>
            <div class="mt-4 flex gap-3">
                <a th:href="@{'/doctor/records/add?patientId=' + ${appt.patient.id}}" 
                   class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition cursor-pointer">
                    Add Medical Record
                </a>
                <a th:href="@{'/doctor/prescriptions/add?patientId=' + ${appt.patient.id}}" 
                   class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium rounded-lg transition cursor-pointer">
                    Add Prescription
                </a>
            </div>
        </div>
    </div>
</body>
</html>
