<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Patients - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-emerald-200">|</span>
                    <span class="text-sm">Patients</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-sm hover:text-emerald-200 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-emerald-800 hover:bg-emerald-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">My Patients</h1>
        
        <div th:if="${param.recordAdded}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">
            Medical record added successfully!
        </div>
        <div th:if="${param.prescriptionAdded}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">
            Prescription added successfully!
        </div>

        <div th:if="${#lists.isEmpty(appointments)}" class="bg-white rounded-xl shadow-md p-12 text-center text-gray-500">
            No patients yet.
        </div>
        
        <div th:each="appt : ${appointments}" class="bg-white rounded-xl shadow-md p-6 mb-4">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-semibold text-gray-800" th:text="${appt.patient.name}">Patient Name</h3>
                    <p class="text-sm text-gray-500">Age: <span th:text="${appt.patient.age}">0</span> | Gender: <span th:text="${appt.patient.gender}">-</span></p>
                    <p class="text-sm text-gray-500" th:text="'Phone: ' + ${appt.patient.phone}">Phone</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500" th:text="${appt.date} + ' at ' + ${appt.time}">DateTime</p>
                </div>
            </div>
            <div class="mt-4 flex gap-3">
                <a th:href="@{/doctor/records/add(patientId=${appt.patient.id})}" 
                   class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition cursor-pointer">
                    Add Medical Record
                </a>
                <a th:href="@{/doctor/prescriptions/add(patientId=${appt.patient.id})}" 
                   class="px-3 py-1 bg-purple-600 hover:bg-purple-700 text-white text-sm rounded transition cursor-pointer">
                    Add Prescription
                </a>
            </div>
        </div>
    </div>
</body>
</html>
