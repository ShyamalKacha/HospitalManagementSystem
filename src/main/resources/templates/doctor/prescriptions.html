<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Prescriptions - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a th:href="@{/doctor/dashboard}" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-green-500 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">HMS</span>
                    </a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-600">My Prescriptions</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-sm text-gray-600 hover:text-gray-900 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">My Prescriptions</h1>
        
        <div th:if="${#lists.isEmpty(prescriptions)}" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-12 text-center text-gray-500">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                </svg>
            </div>
            No prescriptions added yet.
        </div>
        
        <div th:each="rx : ${prescriptions}" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-4 hover:shadow-md transition">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="font-semibold text-gray-800" th:text="${rx.patient.name}">Patient Name</h3>
                    <p class="text-sm text-gray-500">Age: <span th:text="${rx.patient.age}">0</span> | Gender: <span th:text="${rx.patient.gender}">-</span></p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500" th:text="${rx.date}">Date</p>
                    <a th:href="@{'/doctor/prescriptions/download/' + ${rx.id}}" 
                       class="inline-block mt-2 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium rounded-lg transition cursor-pointer">
                        Download PDF
                    </a>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div class="p-4 bg-gray-50 rounded-xl">
                    <p class="text-sm font-medium text-gray-500 mb-1">Medicines</p>
                    <p class="text-gray-800 font-medium" th:text="${rx.medicines}">Medicines</p>
                </div>
                <div class="p-4 bg-gray-50 rounded-xl">
                    <p class="text-sm font-medium text-gray-500 mb-1">Dosage</p>
                    <p class="text-gray-800 font-medium" th:text="${rx.dosage}">Dosage</p>
                </div>
            </div>
            <div class="mt-4 p-4 bg-gray-50 rounded-xl">
                <p class="text-sm font-medium text-gray-500 mb-1">Instructions</p>
                <p class="text-gray-800" th:text="${rx.instructions}">Instructions</p>
            </div>
        </div>
    </div>
</body>
</html>
