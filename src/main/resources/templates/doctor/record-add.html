<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Medical Record - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-emerald-200">|</span>
                    <span class="text-sm">Add Medical Record</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/doctor/dashboard}" class="text-sm hover:text-emerald-200 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-emerald-800 hover:bg-emerald-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Add Medical Record</h2>
            
            <div class="mb-4 p-3 bg-gray-50 rounded-lg">
                <p class="text-sm text-gray-600">Patient: <span class="font-medium" th:text="${patient?.name}">Name</span></p>
            </div>
            
            <form th:action="@{/doctor/records/add}" method="post" class="space-y-4">
                <input type="hidden" name="patientId" th:value="${patient?.id}">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Diagnosis</label>
                    <input type="text" name="diagnosis" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                    <textarea name="notes" rows="4" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition"></textarea>
                </div>
                
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition cursor-pointer">
                    Save Record
                </button>
            </form>
        </div>
    </div>
</body>
</html>
