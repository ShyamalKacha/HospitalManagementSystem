<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Boot MVC Hospital</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; display: flex; flex-direction: column; min-height: 100vh;}
        .nav-bar { background-color: #2c3e50; padding: 15px; text-align: center; margin-bottom: 50px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; font-size: 16px; padding: 5px 10px; border-radius: 4px; }
        .nav-bar a:hover { background-color: #34495e; }
        .active-link { background-color: #27ae60; }
        .hero { text-align: center; padding: 40px 20px; }
        .hero h1 { color: #2c3e50; font-size: 48px; margin-bottom: 10px; }
        .hero p { color: #7f8c8d; font-size: 18px; margin-bottom: 40px; }
        .cards-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); width: 250px; text-align: center; transition: transform 0.2s; text-decoration: none; color: inherit; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .card h2 { color: #34495e; font-size: 24px; margin-top: 0; }
        .card p { color: #7f8c8d; font-size: 14px; }
        .c-patient { border-bottom: 5px solid #3498db; }
        .c-doctor { border-bottom: 5px solid #16a085; }
        .c-appt { border-bottom: 5px solid #8e44ad; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="/" class="active-link">Home</a>
        <a href="/patient">Manage Patients</a>
        <a href="/doctor">Manage Doctors</a>
        <a href="/appointment">Manage Appointments</a>
    </div>

    <div class="hero">
        <h1>🏥 Spring Boot HMS</h1>
        
        <div class="cards-container">
            <a href="/patient" class="card c-patient">
                <h2>Patients</h2>
                <p>Manage patient repository layer.</p>
            </a>
            
            <a href="/doctor" class="card c-doctor">
                <h2>Doctors</h2>
                <p>Manage highly decoupled doctor services.</p>
            </a>

            <a href="/appointment" class="card c-appt">
                <h2>Appointments</h2>
                <p>Schedule visits via Spring MVC endpoints.</p>
            </a>
        </div>
    </div>
</body>
</html>
