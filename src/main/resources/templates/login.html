<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 to-green-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="h-2 bg-gradient-to-r from-cyan-500 to-green-500"></div>
            <div class="p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-cyan-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900">HMS</h1>
                    <p class="text-gray-500 mt-1">Hospital Management System</p>
                </div>
                
                <div th:if="${error}" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
                    <span th:text="${error}"></span>
                </div>
                
                <div th:if="${param.registered}" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-lg text-sm">
                    Registration successful! Please login.
                </div>
                
                <div th:if="${param.loggedout}" class="mb-4 p-3 bg-cyan-50 border border-cyan-200 text-cyan-600 rounded-lg text-sm">
                    You have been logged out.
                </div>

                <form th:action="@{/auth/login}" method="post" class="space-y-5">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter your username"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                    </div>
                    
                    <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-cyan-600 to-cyan-700 hover:from-cyan-700 hover:to-cyan-800 text-white font-semibold rounded-xl transition cursor-pointer shadow-md hover:shadow-lg">
                        Sign In
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <a th:href="@{/auth/register}" class="text-cyan-600 hover:text-cyan-800 font-medium text-sm">
                        Create New Account
                    </a>
                </div>
                
                <div class="mt-6 p-4 bg-gray-50 rounded-xl text-sm">
                    <p class="font-semibold text-gray-700 mb-2">Demo Accounts:</p>
                    <div class="space-y-1 text-gray-600">
                        <p><span class="font-medium">Admin:</span> admin / admin123</p>
                        <p><span class="font-medium">Doctor:</span> dr_smith / doctor123</p>
                        <p><span class="font-medium">Patient:</span> john / patient123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
