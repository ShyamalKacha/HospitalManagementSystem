<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Sans', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 to-green-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl border-t-4 border-cyan-600">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-cyan-800 font-mono">HMS</h1>
            <p class="text-gray-500 mt-1">Hospital Management System</p>
        </div>
        
        <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg">
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${param.registered}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">
            Registration successful! Please login.
        </div>
        
        <div th:if="${param.loggedout}" class="mb-4 p-3 bg-cyan-100 border border-cyan-400 text-cyan-700 rounded-lg">
            You have been logged out.
        </div>

        <form th:action="@{/auth/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition">
            </div>
            
            <button type="submit"
                class="w-full py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold rounded-lg transition cursor-pointer">
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a th:href="@{/auth/register}" class="text-cyan-600 hover:text-cyan-800 hover:underline font-medium">
                Create New Account
            </a>
        </div>
        
        <div class="mt-6 p-4 bg-gray-50 rounded-lg text-sm text-gray-600">
            <p class="font-semibold mb-2">Demo Accounts:</p>
            <p>admin / admin123 (Admin)</p>
            <p>dr_smith / doctor123 (Doctor)</p>
            <p>john / patient123 (Patient)</p>
        </div>
    </div>
</body>
</html>
