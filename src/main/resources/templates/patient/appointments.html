<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Appointments - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-cyan-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/patient/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-cyan-200">|</span>
                    <span class="text-sm">Appointments</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/patient/dashboard}" class="text-sm hover:text-cyan-200 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-cyan-800 hover:bg-cyan-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">My Appointments</h1>
            <a th:href="@{/patient/book}" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition cursor-pointer">Book New</a>
        </div>
        
        <div th:if="${param.booked}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">
            Appointment booked successfully!
        </div>
        <div th:if="${param.cancelled}" class="mb-4 p-3 bg-yellow-100 border border-yellow-400 text-yellow-700 rounded-lg">
            Appointment cancelled.
        </div>

        <div th:if="${#lists.isEmpty(appointments)}" class="bg-white rounded-xl shadow-md p-12 text-center text-gray-500">
            No appointments yet. <a th:href="@{/patient/book}" class="text-cyan-600 hover:underline">Book one now</a>
        </div>
        
        <table th:if="${!#lists.isEmpty(appointments)}" class="w-full bg-white rounded-xl shadow-md overflow-hidden">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Doctor</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Specialty</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Date</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Time</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Reason</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Status</th>
                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appt : ${appointments}" class="border-t">
                    <td class="px-4 py-3">Dr. <span th:text="${appt.doctor.name}">Doctor</span></td>
                    <td class="px-4 py-3 text-gray-600" th:text="${appt.doctor.specialty}">Specialty</td>
                    <td class="px-4 py-3" th:text="${appt.date}">Date</td>
                    <td class="px-4 py-3" th:text="${appt.time}">Time</td>
                    <td class="px-4 py-3 text-gray-600" th:text="${appt.reason}">Reason</td>
                    <td class="px-4 py-3">
                        <span th:class="${appt.status == 'CONFIRMED' ? 'px-2 py-1 bg-green-100 text-green-700 rounded text-xs' : 
                            (appt.status == 'PENDING' ? 'px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs' :
                            (appt.status == 'CANCELLED' ? 'px-2 py-1 bg-red-100 text-red-700 rounded text-xs' : 'px-2 py-1 bg-gray-100 text-gray-700 rounded text-xs'))}"
                            th:text="${appt.status}">Status</span>
                    </td>
                    <td class="px-4 py-3">
                        <form th:if="${appt.status == 'PENDING'}" th:action="@{/patient/appointments/cancel/{id}(id=${appt.id})}" method="post">
                            <button type="submit" class="text-red-600 hover:text-red-800 text-sm cursor-pointer">Cancel</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
