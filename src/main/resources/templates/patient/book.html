<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-cyan-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/patient/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-cyan-200">|</span>
                    <span class="text-sm">Book Appointment</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/patient/dashboard}" class="text-sm hover:text-cyan-200 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-cyan-800 hover:bg-cyan-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">
        <div th:if="${param.booked}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg">
            Appointment booked successfully!
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Book New Appointment</h2>
            
            <form th:action="@{/patient/book}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Doctor</label>
                    <select name="doctorId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none transition">
                        <option value="">-- Select Doctor --</option>
                        <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.name} + ' - ' + ${doc.specialty}">Doctor</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" name="date" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
                        <input type="time" name="time" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none transition">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Reason for Visit</label>
                    <textarea name="reason" rows="3" required placeholder="Describe your symptoms or reason for visit..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none transition"></textarea>
                </div>
                
                <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition cursor-pointer">
                    Book Appointment
                </button>
            </form>
        </div>
    </div>
</body>
</html>
