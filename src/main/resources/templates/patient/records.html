<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Medical Records - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Fira Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-cyan-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/patient/dashboard}" class="text-xl font-bold font-mono">HMS</a>
                    <span class="text-cyan-200">|</span>
                    <span class="text-sm">Medical Records</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/patient/dashboard}" class="text-sm hover:text-cyan-200 transition">Dashboard</a>
                    <a th:href="@{/auth/logout}" class="px-3 py-1 bg-cyan-800 hover:bg-cyan-900 rounded text-sm transition cursor-pointer">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">My Medical Records</h1>
        
        <div th:if="${#lists.isEmpty(records)}" class="bg-white rounded-xl shadow-md p-12 text-center text-gray-500">
            No medical records yet.
        </div>
        
        <div th:each="record : ${records}" class="bg-white rounded-xl shadow-md p-6 mb-4">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="font-semibold text-gray-800">Dr. <span th:text="${record.doctor.name}">Doctor</span></h3>
                    <p class="text-sm text-gray-500" th:text="${record.doctor.specialty}">Specialty</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500" th:text="${record.date}">Date</p>
                    <a th:href="@{'/patient/records/download/' + ${record.id}}" 
                       class="inline-block mt-2 px-3 py-1 bg-orange-600 hover:bg-orange-700 text-white text-sm rounded transition cursor-pointer">
                        Download PDF
                    </a>
                </div>
            </div>
            <div class="mt-3">
                <p class="text-sm font-medium text-gray-600">Diagnosis:</p>
                <p class="text-gray-800" th:text="${record.diagnosis}">Diagnosis</p>
            </div>
            <div class="mt-3">
                <p class="text-sm font-medium text-gray-600">Notes:</p>
                <p class="text-gray-800" th:text="${record.notes}">Notes</p>
            </div>
        </div>
    </div>
</body>
</html>
