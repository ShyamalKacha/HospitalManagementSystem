<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Figtree', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 to-green-50 min-h-screen flex items-center justify-center py-10 p-4">
    <div class="w-full max-w-lg">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="h-2 bg-gradient-to-r from-cyan-500 to-green-500"></div>
            <div class="p-8">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-cyan-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-7 h-7 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
                    <p class="text-gray-500 mt-1">Hospital Management System</p>
                </div>
                
                <div th:if="${error}" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
                    <span th:text="${error}"></span>
                </div>

                <form th:action="@{/auth/register}" method="post" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="username" name="username" required placeholder="username"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" id="password" name="password" required placeholder="********"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">I am a</label>
                        <div class="flex gap-3">
                            <label class="flex-1 flex items-center justify-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-cyan-50 hover:border-cyan-300 transition has-[:checked]:bg-cyan-50 has-[:checked]:border-cyan-500">
                                <input type="radio" name="role" value="PATIENT" class="mr-2 text-cyan-600 focus:ring-cyan-500" checked>
                                <span class="font-medium">Patient</span>
                            </label>
                            <label class="flex-1 flex items-center justify-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-cyan-50 hover:border-cyan-300 transition has-[:checked]:bg-cyan-50 has-[:checked]:border-cyan-500">
                                <input type="radio" name="role" value="DOCTOR" class="mr-2 text-cyan-600 focus:ring-cyan-500">
                                <span class="font-medium">Doctor</span>
                            </label>
                        </div>
                    </div>
                    
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                            <input type="number" id="age" name="age" placeholder="25"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                            <select id="gender" name="gender" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                            <input type="text" id="phone" name="phone" placeholder="+1 234 567 8900"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                        </div>
                    </div>
                    
                    <div>
                        <label for="specialty" class="block text-sm font-medium text-gray-700 mb-1">Specialty</label>
                        <select id="specialty" name="specialty" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50">
                            <option value="">-- Select Specialty --</option>
                            <option value="General">General Medicine</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Ophthalmology">Ophthalmology</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                        <textarea id="address" name="address" rows="2" placeholder="Your address"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition bg-gray-50"></textarea>
                    </div>
                    
                    <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-cyan-600 to-cyan-700 hover:from-cyan-700 hover:to-cyan-800 text-white font-semibold rounded-xl transition cursor-pointer shadow-md hover:shadow-lg">
                        Register
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <a th:href="@{/auth/login}" class="text-cyan-600 hover:text-cyan-800 font-medium text-sm">
                        Already have an account? Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
