<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments - Spring MVC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; }
        .nav-bar { background-color: #2c3e50; padding: 15px; text-align: center; margin-bottom: 30px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; font-size: 16px; padding: 5px 10px; border-radius: 4px; }
        .nav-bar a:hover { background-color: #34495e; }
        .active-link { background-color: #8e44ad; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #8e44ad;}
        h2, h3 { color: #34495e; text-align: center; }
        .form-section { margin-bottom: 25px; padding: 15px; background: #fdfdfd; border: 1px solid #eaeaea; border-radius: 6px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; font-weight: bold; color: #555; font-size: 13px;}
        input[type="text"] { padding: 8px; width: 220px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"], button { padding: 8px 15px; background: #8e44ad; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; margin-top: 10px;}
        table { border-collapse: collapse; width: 100%; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/patient">Manage Patients</a>
        <a href="/doctor">Manage Doctors</a>
        <a href="/appointment" class="active-link">Manage Appointments</a>
    </div>

    <div class="container">
        <h2>Appointment Management</h2>
        
        <div class="form-section">
             <h3>Search Results / Records</h3>
             <table>
                 <tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th></tr>
                 <tr th:each="a : ${appointments}">
                     <td th:text="${a.id}"></td>
                     <td th:text="${a.patientName}"></td>
                     <td th:text="${a.doctorName}"></td>
                     <td th:text="${a.appointmentDate}"></td>
                 </tr>
             </table>
        </div>

        <div class="form-section">
            <h3>Create Appointment</h3>
            <form action="/appointment/add" method="post">
                <div class="form-group"><label>Patient Name:</label><input type="text" name="patientName" required/></div>
                <div class="form-group"><label>Doctor Name:</label><input type="text" name="doctorName" required/></div>
                <div class="form-group"><label>Date:</label><input type="text" name="date" required/></div>
                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="form-section">
            <h3>Update Appointment</h3>
            <form action="/appointment/update" method="post">
                <div class="form-group"><label>Patient Name:</label><input type="text" name="patientName" required/></div>
                <div class="form-group"><label>New Doctor:</label><input type="text" name="newDoctor" required/></div>
                <div class="form-group"><label>New Date:</label><input type="text" name="newDate" required/></div>
                <button type="submit" style="background:#e67e22;">Reschedule</button>
            </form>
        </div>

        <div class="form-section">
            <h3>Search Appointment</h3>
            <form action="/appointment/search" method="post">
                <div class="form-group"><label>Patient Name:</label><input type="text" name="patientName" required/></div>
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="form-section">
            <h3>Cancel Appointment</h3>
            <form action="/appointment/delete" method="post">
                <div class="form-group"><label>Patient Name:</label><input type="text" name="patientName" required/></div>
                <button type="submit" style="background:#e74c3c;">Cancel</button>
            </form>
        </div>
    </div>
</body>
</html>
