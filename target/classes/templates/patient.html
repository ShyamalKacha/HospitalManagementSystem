<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients - Spring MVC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; }
        .nav-bar { background-color: #2c3e50; padding: 15px; text-align: center; margin-bottom: 30px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; font-size: 16px; padding: 5px 10px; border-radius: 4px; }
        .nav-bar a:hover { background-color: #34495e; }
        .active-link { background-color: #3498db; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #3498db;}
        h2, h3 { color: #34495e; text-align: center; }
        .form-section { margin-bottom: 25px; padding: 15px; background: #fdfdfd; border: 1px solid #eaeaea; border-radius: 6px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; font-weight: bold; color: #555; font-size: 13px;}
        input[type="text"], input[type="number"] { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"], button { padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; margin-top: 10px;}
        table { border-collapse: collapse; width: 100%; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/patient" class="active-link">Manage Patients</a>
        <a href="/doctor">Manage Doctors</a>
        <a href="/appointment">Manage Appointments</a>
    </div>

    <div class="container">
        <h2>Patient Management</h2>
        
        <div class="form-section">
             <h3>Search Results / Records</h3>
             <table>
                 <tr><th>ID</th><th>Name</th><th>Age</th></tr>
                 <tr th:each="p : ${patients}">
                     <td th:text="${p.id}"></td>
                     <td th:text="${p.name}"></td>
                     <td th:text="${p.age}"></td>
                 </tr>
             </table>
        </div>

        <div class="form-section">
            <h3>Add Patient</h3>
            <form action="/patient/add" method="post">
                <div class="form-group"><label>Name:</label><input type="text" name="name" required/></div>
                <div class="form-group"><label>Age:</label><input type="number" name="age" required/></div>
                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="form-section">
            <h3>Update Patient</h3>
            <form action="/patient/update" method="post">
                <div class="form-group"><label>Exact Name:</label><input type="text" name="name" required/></div>
                <div class="form-group"><label>New Age:</label><input type="number" name="age" required/></div>
                <button type="submit" style="background:#e67e22;">Update</button>
            </form>
        </div>

        <div class="form-section">
            <h3>Search Patient</h3>
            <form action="/patient/search" method="post">
                <div class="form-group"><label>Name:</label><input type="text" name="name" required/></div>
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="form-section">
            <h3>Delete Patient</h3>
            <form action="/patient/delete" method="post">
                <div class="form-group"><label>Exact Name:</label><input type="text" name="name" required/></div>
                <button type="submit" style="background:#e74c3c;">Delete</button>
            </form>
        </div>
    </div>
</body>
</html>
